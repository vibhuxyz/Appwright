name: Appwright

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: appwright
      POSTGRES_PASSWORD: appwright
      POSTGRES_DB: appwright
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appwright"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # `docker compose -f infrastructure/compose/docker-compose.dev.yml --profile events up`
  # Off by default — see docker-compose.yml at the repo root for why (nothing
  # publishes an event yet). Once up, run a worker natively against it:
  #   KAFKA_BROKERS=localhost:9092 bun --filter worker-indexing dev
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["events"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  pgdata:
