[project]
name = "agent-core"
version = "0.0.0"
description = "The agent loop, message/event types, and provider adapters. No I/O opinions."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "anthropic>=0.42",
    "openai>=1.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
