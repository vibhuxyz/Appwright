[project]
name = "devian-tools"
version = "0.0.0"
description = "Agent tools: filesystem, bash, grep, git — plus the path fence."
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devian_tools"]
