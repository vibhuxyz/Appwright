# Appwright — local stack.
# This replaces Turborepo's job: it is what actually runs the services.
# Same shape we need in V3, so local dev and cloud deployment stay close.
#
#   make up      start
#   make logs    tail
#   make down    stop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: appwright
      POSTGRES_PASSWORD: appwright
      POSTGRES_DB: appwright
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appwright"]
      interval: 5s
      retries: 10

  # Not needed until V3 (queue + pub/sub). Started early so the wiring is familiar.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Owns HTTP, auth, persistence, and streaming to the browser.
  # Imports @repo/agent-core directly — the agent is a library, not a service.
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://appwright:appwright@postgres:5432/appwright
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - workspaces:/workspaces

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages

  # V3 agent worker: claims Jobs from Postgres, runs tools in a sandbox.
  #   docker compose --profile v3 up
  # Needs EXECUTION_MODE=sandboxed on the API and matching SANDBOX_PROVIDER.
  agent:
    profiles: ["v3"]
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    command: ["bun", "--filter", "agent-worker", "start"]
    environment:
      DATABASE_URL: postgresql://appwright:appwright@postgres:5432/appwright
      REDIS_URL: redis://redis:6379
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-local}
      E2B_API_KEY: ${E2B_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-5.4-mini}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      WORKSPACE_ROOT: /workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/agent:/app/apps/agent
      - ./packages:/app/packages
      - workspaces:/workspaces

  # ── Everything below: `docker compose --profile events up` ──────────────
  # Off by default. Nothing in the default stack (api, web) publishes or
  # consumes an event yet, so a broker with nothing using it would just be
  # a slow `docker compose up` for no observable benefit. Bring this profile
  # up specifically to exercise workers/* against packages/events.
  # NOTE: this Kafka config has not been run in this repo yet — treat it as
  # a documented starting point, not a verified one, and fix forward.
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["events"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  worker-indexing:
    build:
      context: .
      dockerfile: infrastructure/docker/workers/Dockerfile
    profiles: ["events"]
    command: ["bun", "--filter", "worker-indexing", "start"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka

  worker-evaluation:
    build:
      context: .
      dockerfile: infrastructure/docker/workers/Dockerfile
    profiles: ["events"]
    command: ["bun", "--filter", "worker-evaluation", "start"]
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka

  worker-maintenance:
    build:
      context: .
      dockerfile: infrastructure/docker/workers/Dockerfile
    profiles: ["events"]
    command: ["bun", "--filter", "worker-maintenance", "start"]

volumes:
  pgdata:
  # Generated projects live here. Shared between api (reads the file tree)
  # and agent (writes files). In V3 this is replaced by a real sandbox.
  workspaces:
