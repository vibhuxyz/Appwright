[project]
name = "devian-agent"
version = "0.0.0"
description = "Devian agent service — HTTP/SSE wrapper around the agent loop."
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "devian-tools",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

# Real commands, installed into the venv by `uv sync`.
# Same command works on your laptop, in CI, and as a container CMD.
# Nothing wraps them — make/compose are optional sugar on top.
[project.scripts]
devian-serve = "devian_agent.main:serve"
devian-agent = "devian_agent.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devian_agent"]
